<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the page draws edge to edge and pads itself with
         env(safe-area-inset-*) (notch in landscape, home indicator). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Browser/status-bar colour = the app header (--card) in each theme.
         The theme script below and src/lib/theme-color.ts replace both with
         one unscoped meta when a theme is picked in the app. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#221b16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default": an opaque status bar that the page starts below, so the
         header is never under the notch or the clock in standalone mode. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HoppyHour" />
    <title>HoppyHour – Find happy hour deals near you</title>

    <!-- Apply the saved (or system) theme before first paint to avoid a
         light-mode flash for dark-mode users. Key matches next-themes' default. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark =
            t === "dark" ||
            ((!t || t === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          // A theme picked in the app: one theme-color meta without a media
          // query replaces both (see src/lib/theme-color.ts).
          if (t === "light" || t === "dark") {
            var metas = document.querySelectorAll('meta[name="theme-color"]');
            var m = document.createElement("meta");
            m.name = "theme-color";
            m.content = t === "dark" ? "#221b16" : "#ffffff";
            if (metas.length) metas[0].parentNode.insertBefore(m, metas[0]);
            else document.head.appendChild(m);
            for (var i = 0; i < metas.length; i++) metas[i].parentNode.removeChild(metas[i]);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Cloudflare Turnstile (bot check on the submit form) -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>

    <!-- SEO -->
    <meta name="description" content="Find happy hour deals at bars and restaurants near you, on a map that shows what is on right now. Anyone can submit a deal." />
    <meta name="author" content="HoppyHour" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HoppyHour – Find happy hour deals near you" />
    <meta property="og:description" content="Find happy hour deals at bars and restaurants near you, on a map that shows what is on right now. Anyone can submit a deal." />
    <meta property="og:image" content="https://hoppyhour.soderholm.app/og-image.png" />
    <meta property="og:url" content="https://hoppyhour.soderholm.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@HoppyHour" />
    <meta name="twitter:title" content="HoppyHour – Find happy hour deals near you" />
    <meta name="twitter:description" content="Find happy hour deals at bars and restaurants near you, on a map that shows what is on right now. Anyone can submit a deal." />
    <meta name="twitter:image" content="https://hoppyhour.soderholm.app/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
